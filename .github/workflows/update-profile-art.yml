name: Update profile art

"on":
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["*.svg", "data/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild heatmap
        run: |
          pip install requests beautifulsoup4 lxml
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=vedansh-01&theme=dark&hide_border=true&disable_animations=true
          path: streak-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "streak-stats.svg contrib-heatmap.svg data/contributions.json"
